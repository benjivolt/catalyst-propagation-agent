<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Catalyst Propagation{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Catalyst Propagation</a>
    <nav>
      {% set section = section|default('') %}
      <a href="/" {% if section == 'catalysts' %}aria-current="page"{% endif %}>Catalysts</a>
      <a href="/watchlist" {% if section == 'watchlist' %}aria-current="page"{% endif %}>Watchlist</a>
      <a href="/scheduler" {% if section == 'scheduler' %}aria-current="page"{% endif %}>Scheduler</a>
      <a href="/learning" {% if section == 'learning' %}aria-current="page"{% endif %}>Learning</a>
    </nav>
    <a class="btn primary" href="/catalysts/new">Add catalyst</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
